رحلة Strategy & Discovery.", "صح. بتبني أساس النجاح بإنها بتربط أهداف الشغل باحتياجات المستخدم والإمكانية التقنية، علشان المشروع يمشي في اتجاه صح."], ["ترتيب مرحلة التخطيط.", "غلط. Planning & Architecture هي المرحلة رقم 2. المرحلة رقم 3 هي Design & Prototyping."], ["مرحلة اختيار الـ tech stack.", "صح. اختيار التقنيات بيحصل في Planning & Architecture مع تحديد الجداول الزمنية وتجميع الفرق ورسم خرائط الطريق."], ["مرحلة تقييم المخاطر.", "غلط. تقييم المخاطر وتوزيع الموارد بيتعملوا في Planning & Architecture، مش في التصميم. مرحلة التصميم تخص الـ wireframes والـ prototypes."], ["محتوى مرحلة التصميم.", "صح. فيها wireframes لـ UX/UI و prototypes تفاعلية مع تركيز على تجربة مستخدم سلسة."], ["دور Design Systems.", "صح. الـ design systems وأدلة الستايل بتضمن إن كل شاشات التطبيق وتفاعلاته متسقة في الشكل والسلوك."], ["محتوى مرحلة Development & Integration.", "صح. بتتضمن كود الواجهة، خدمات الـ back-end، دمج APIs خارجية، ومزامنة بيانات قوية."], ["هدف مرحلة التطوير.", "صح. المرحلة دي بتحوّل التصاميم لتطبيق شغال فعلاً وسريع."], ["أنواع الاختبار.", "صح. الـ QA الشامل بيشمل اختبار وظيفي (functional) وأداء (performance) وأمان (security)."], ["النشر على المتاجر.", "صح. كل متجر (App Store / Google Play) ليه إرشادات لازم تتبعها قبل القبول، وبعد النشر بيجي التحضير للمراقبة والتحديثات."], ["التنسيق بين الفرق.", "صح. كل مرحلة محتاجة تنسيق بين المصممين والمطورين ومديري المنتج وأصحاب المصلحة علشان المنتج يحقق توقعات المستخدمين وأهداف العمل."], ["الـ Agile.", "صح. المنهجيات الرشيقة بتسمح بتحسينات متكررة (iterative) طول مراحل المشروع بدل ما يتسلم مرة واحدة في الآخر."], ["تعريف الـ front-end.", "صح. هو الطبقة اللي المستخدم بيشوفها ويتفاعل معاها، وبيحدد تجربة الاستخدام."], ["الـ Native والأداء الحرج.", "صح. الملف بيسميه المعيار الذهبي للتطبيقات اللي الأداء فيها حرج (ألعاب، تطبيقات ثقيلة)."], ["ميزة Swift.", "صح. Swift بتوفر أمان الذاكرة (memory safety) وصياغة حديثة، وهي لغة iOS."], ["ميزة Kotlin.", "صح. كود مختصر ومتوافق تمامًا مع Java، وهي لغة أندرويد."], ["وصول الـ Native للمنصة.", "صح. لغات الـ n function sh(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function build(m){const t=TF.map((x,n)=>({...x,e:EXTF[n]}));
const c=MCQ.map((x,n)=>{const o=sh(x.o.map((s,k)=>({s,k})));return{t:'mcq',q:x.q,o:o.map(z=>z.s),a:o.findIndex(z=>z.k===0),e:EXMCQ[n]}});
let r=m==='tf'?t:m==='mcq'?c:t.concat(c);return document.getElementById('shuf').checked?sh(r):r}
