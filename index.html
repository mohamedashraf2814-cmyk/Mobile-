.next{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:600}
.big{font-size:3rem;font-weight:700;text-align:center;margin:10px 0}

.rev{padding:10px 0;border-top:1px solid var(--line);font-size:.95rem}

function sh(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function build(m){const t=TF.map(x=>({...x}));
const c=MCQ.map(x=>{const o=sh(x.o.map((s,k)=>({s,k})));return{t:'mcq',q:x.q,o:o.map(z=>z.s),a:o.findIndex(z=>z.k===0),e:x.e}});
let r=m==='tf'?t:m==='mcq'?c:t.concat(c);return document.getElementById('shuf').checked?sh(r):r}
function start(m){mode=m;items=build(m);i=0;score=0;log=[];answered=false;
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.m===m));render()}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
if(i>=items.length)return done();
const it=items[i];
const opts=it.t==='tf'?['True','False']:it.o;
app.innerHTML=`<div class="card"><div class="bar"><i style="width:${i/items.length*100}%"></i></div>
<div class="meta"><span>Question ${i+1} of ${items.length}</span><span>Score: ${score}</span></div>
<p class="q">${esc(it.q)}</p>
${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}
<div id="fb"></div></div>`;
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));answered=false}
function pick(k){if(answered)return;answered=true;const it=items[i];
const right=it.t==='tf'?(it.a?0:1):it.a;const ok=k===right;if(ok)score++;
log.push({q:it.q,ok,ans:it.t==='tf'?(it.a?'True':'False'):it.o[it.a]});
app.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(n===right)b.classList.add('ok');else if(n===k)b.classList.add('bad')});
document.getElementById('fb').innerHTML=`<div class="fb" dir="rtl"><b>${ok?'✅ صح!':'❌ غلط.'}</b> ${esc(it.e)}</div><button class="next" id="nx">${i+1<items.length?'Next →':'See results'}</button>`;
document.getElementById('nx').onclick=()=>{i++;render()}}
function done(){const p=Math.round(score/items.length*100);
app.innerHTML=`<div class="card center"><div class="big">${score} / ${items.length}</div><p>${p}% — ${p>=80?'Excellent! 🎉':p>=60?'Good, keep practicing 👍':'Review the material and try again 📚'}</p>
<button class="next" id="rt">Try again (reshuffled)</button></div>
<div class="card"><b>Review</b>${log.map(l=>`<div class="rev"><b class="${l.ok?'ok':'bad'}">${l.ok?'✓':'✗'}</b> ${esc(l.q)}<br><small>Answer: ${esc(l.ans)}</small></div>`).join('')}</div>`;
document.getElementById('rt').onclick=()=>start(mode)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>start(b.dataset.m));
start('tf');
</script>
